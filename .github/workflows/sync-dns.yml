name: Sync DNS

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dns-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Synchronize Cloudflare DNS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Validate domain registry
        run: |
          python scripts/validate_domains.py
          python scripts/validate_requests.py

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo "❌ CLOUDFLARE_ZONE_ID is missing"
            exit 1
          fi

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "❌ CLOUDFLARE_API_TOKEN is missing"
            exit 1
          fi

          echo "✅ CLOUDFLARE_ZONE_ID is available"
          echo "✅ CLOUDFLARE_API_TOKEN is available"

      - name: Synchronize DNS with Cloudflare
        env:
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python scripts/sync_dns.py

      - name: DNS synchronization complete
        run: |
          echo "✅ DNS synchronization workflow completed successfully."

