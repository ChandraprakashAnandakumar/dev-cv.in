name: Validate Domain Registry

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate domains
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Validate domain files
        run: |
          python scripts/validate_domains.py

      - name: Validate request files
        run: |
          python scripts/validate_requests.py

      - name: Test available subdomain
        run: |
          python scripts/check_availability.py myproject

      - name: Test reserved subdomain
        run: |
          if python scripts/check_availability.py admin; then
            echo "ERROR: Reserved subdomain was incorrectly accepted."
            exit 1
          fi

      - name: Test existing domain
        run: |
          if python scripts/check_availability.py example; then
            echo "ERROR: Existing domain was incorrectly accepted."
            exit 1
          fi

      - name: Validation complete
        run: |
          echo "All dev-cv.in validation checks passed."
