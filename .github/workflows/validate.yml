name: Validate Domain Registry

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate domains
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v5
        with:
          path: pr

      - name: Checkout trusted main
        uses: actions/checkout@v5
        with:
          ref: main
          path: trusted

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Validate domain files
        run: |
          cp ../trusted/scripts/validate_domains.py /tmp/validate_domains.py
          python /tmp/validate_domains.py "$GITHUB_WORKSPACE/pr"
        working-directory: pr

      - name: Validate request files
        run: |
          cp ../trusted/scripts/validate_requests.py /tmp/validate_requests.py
          python /tmp/validate_requests.py "$GITHUB_WORKSPACE/pr"
        working-directory: pr

      - name: Test available subdomain
        run: |
          cp ../trusted/scripts/check_availability.py /tmp/check_availability.py
          python /tmp/check_availability.py myproject "$GITHUB_WORKSPACE/pr"
        working-directory: pr

      - name: Test reserved subdomain
        run: |
          cp ../trusted/scripts/check_availability.py /tmp/check_availability.py

          if python /tmp/check_availability.py admin "$GITHUB_WORKSPACE/pr"; then
            echo "ERROR: Reserved subdomain was incorrectly accepted."
            exit 1
          fi
        working-directory: pr

      - name: Test existing domain
        run: |
          cat > domains/ci-test.json <<'EOF'
          {
            "subdomain": "ci-test",
            "owner": {
              "github": "test-user"
            },
            "target": {
              "type": "CNAME",
              "value": "example.com"
            },
            "project": {
              "name": "CI Test",
              "description": "Temporary domain used only during CI validation."
            }
          }
          EOF

          cp trusted/scripts/check_availability.py /tmp/check_availability.py

          if python /tmp/check_availability.py ci-test "$GITHUB_WORKSPACE/pr"; then
            echo "ERROR: Existing domain was incorrectly accepted."
            rm -f domains/ci-test.json
            exit 1
          fi

          rm -f domains/ci-test.json
        working-directory: pr

      - name: Validation complete
        run: |
          echo "All dev-cv.in validation checks passed."
