name: Validate Subdomain Request

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate dev-cv.in request
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests dnspython

      - name: Security check
        run: |
          python .github/workflows/check-pr-security.py

      - name: Duplicate subdomain check
        run: |
          python .github/workflows/check-duplicate.py

      - name: Subdomain availability check
        run: |
          python .github/workflows/check-subdomain.py

      - name: Request owner check
        run: |
          python .github/workflows/check-request-owner.py

      - name: PR author verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/workflows/check-pr-author.py

      - name: Validate request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/workflows/validate_request.py
