name: Validate Subdomain Request

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate dev-cv.in request
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Pull Request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests dnspython

      - name: Prepare trusted validation scripts
        run: |
          mkdir -p /tmp/dev-cv-validation

          git show origin/main:.github/workflows/check-pr-security.py \
            > /tmp/dev-cv-validation/check-pr-security.py

          git show origin/main:.github/workflows/check-duplicate.py \
            > /tmp/dev-cv-validation/check-duplicate.py

          git show origin/main:.github/workflows/check-subdomain.py \
            > /tmp/dev-cv-validation/check-subdomain.py

          git show origin/main:.github/workflows/check-request-owner.py \
            > /tmp/dev-cv-validation/check-request-owner.py

          git show origin/main:.github/workflows/check-pr-author.py \
            > /tmp/dev-cv-validation/check-pr-author.py

          git show origin/main:.github/workflows/validate_request.py \
            > /tmp/dev-cv-validation/validate_request.py

      - name: Security check
        run: |
          python /tmp/dev-cv-validation/check-pr-security.py

      - name: Duplicate subdomain check
        run: |
          python /tmp/dev-cv-validation/check-duplicate.py

      - name: Subdomain availability check
        run: |
          python /tmp/dev-cv-validation/check-subdomain.py

      - name: Request owner check
        run: |
          python /tmp/dev-cv-validation/check-request-owner.py

      - name: PR author verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python /tmp/dev-cv-validation/check-pr-author.py

      - name: Validate request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python /tmp/dev-cv-validation/validate_request.py
